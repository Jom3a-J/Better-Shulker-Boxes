# Gradle
org.gradle.jvmargs=-Xmx2G -Duser.language=en -Duser.country=US
org.gradle.parallel=true

# Minecraft / Java
# Fabric and Quilt follow the current release. NeoForge has published nothing for 26.3 yet, so it
# stays on 26.2 until it does — which is why the two carry separate Minecraft versions here.
fabric_minecraft_version=26.3
neoforge_minecraft_version=26.2
neoforge_minecraft_version_range=[26.2]

# Fabric Properties
loader_version=0.19.5
fabric_api_version=0.160.5+26.3
fabric_cloth_config_version=26.3.158
modmenu_version=21.0.0-beta.1

# Quilt Properties
quilt_loader_version=0.31.0-beta.4

# NeoForge Properties
# Held at this build on purpose. Moving to the current 26.2 NeoForge (26.2.0.88) fails NeoGradle's
# neoFormRecompile step while recompiling Minecraft's own decompiled source (HolderSet.java) -
# upstream of this mod, and not something it can work around. Versions in between are untested.
neo_version=26.2.0.7-beta
neoforge_cloth_config_version=26.2.155

# Mod Properties
mod_id=bettershulker
mod_name=Better Shulker Boxes
mod_license=MIT
mod_version=1.6.0
maven_group=com.bettershulker
archives_base_name=better-shulker-boxes
